name: FramePilot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Test director rules and generation modes
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Test workbench interactions
        run: npm run test:e2e

      - name: Smoke test Director API
        run: |
          npm run dev:api > /tmp/framepilot-api.log 2>&1 &
          API_PID=$!
          sleep 5
          curl --fail http://127.0.0.1:8787/api/health
          kill $API_PID || true

      - name: Smoke test production web server
        run: |
          PORT=3000 npm start > /tmp/framepilot-web.log 2>&1 &
          WEB_PID=$!
          sleep 5
          curl --fail http://127.0.0.1:3000/
          curl --fail http://127.0.0.1:3000/api/health
          kill $WEB_PID || true
